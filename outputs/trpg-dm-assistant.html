<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#0b0f13;--panel:#121820;--panel2:#18212b;--line:#2a3745;--text:#d8e0e8;
  --muted:#8493a3;--accent:#c5a46d;--accent2:#8eb6a0;--danger:#d56d6d;--warn:#d5ad62;
  --ok:#78b98d;--shadow:0 18px 50px rgba(0,0,0,.35);--radius:12px;
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at top,#15202a 0,#0b0f13 38%,#080b0e 100%);color:var(--text);font-family:"Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.danger{color:var(--danger)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);height:100%}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(10,14,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
.brand{font-weight:800;letter-spacing:.08em;color:var(--accent)}.status-pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#10161c;color:var(--muted);font-size:12px;white-space:nowrap}.top-actions{margin-left:auto;display:flex;gap:8px}.top-actions button,.icon-btn{border:1px solid var(--line);background:#121a22;color:var(--text);padding:7px 10px;border-radius:8px}.top-actions button:hover,.icon-btn:hover{border-color:var(--accent)}
.sidebar{grid-column:1;grid-row:2;padding:14px;overflow:auto;border-right:1px solid var(--line);background:rgba(13,18,23,.95)}
.main{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;overflow:hidden}.sidebar.collapsed{display:none}.app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.section{background:linear-gradient(180deg,rgba(24,33,43,.97),rgba(16,22,29,.97));border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.section h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}.kv{display:grid;grid-template-columns:98px 1fr;gap:7px 10px;font-size:13px}.kv b{color:#eef3f7;font-weight:600}.chip-list{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #3a4a5b;background:#111820;color:#bfcbd7;padding:4px 7px;border-radius:999px;font-size:12px}.meter{margin:7px 0}.meter-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.bar{height:8px;background:#0b1015;border:1px solid #263340;border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#7b9d89,#c5a46d);width:0}
.workspace{height:100%;display:flex;flex-direction:column;min-width:0}.view{display:none;height:100%;overflow:auto;padding:18px}.view.active{display:block}.chat-view.active{display:flex;flex-direction:column;padding:0;overflow:hidden}
.hero{max-width:1100px;margin:0 auto}.hero h1{margin:4px 0 8px;color:#e9dfcd;font-size:30px}.hero p{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:rgba(18,24,32,.95);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px;color:#eadfc8}.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;color:#b9c5d1;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #314050;border-radius:8px;background:#0c1218;color:var(--text);padding:10px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}.btn{border:1px solid #3a4b5c;border-radius:8px;background:#18222c;color:#e7edf2;padding:9px 13px}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:#8c744d;border-color:#b99a66;color:#fff}.btn.danger{background:#3a2022;border-color:#743b40;color:#ffd9d9}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.notice{padding:10px 12px;border-radius:8px;border:1px solid #3a4652;background:#10171e;color:#b8c4cf;font-size:13px;line-height:1.65}.notice.warn{border-color:#765b30;background:#241c10;color:#e4c78c}.notice.danger{border-color:#6b3338;background:#241315;color:#efb3b8}.notice.ok{border-color:#315e40;background:#102017;color:#b9e2c4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#111820;color:var(--muted);padding:8px 11px;border-radius:8px}.tab.active{border-color:var(--accent);color:#fff;background:#2a241b}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(15,20,26,.96)}.chat-log{flex:1;overflow:auto;padding:18px}.message{max-width:880px;margin:0 auto 14px;border:1px solid var(--line);border-radius:12px;background:#111820;padding:12px 14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.message.player{border-color:#4e5263;background:#171927}.message.ai{border-color:#5c513f;background:#1b1915}.message.system{border-style:dashed;color:#aab7c4}.message.error{border-color:#6c3539;background:#251417;color:#ffc3c7}.msg-meta{display:flex;gap:8px;margin-bottom:7px;color:var(--muted);font-size:12px}.msg-role{font-weight:700;color:var(--accent)}.chat-compose{border-top:1px solid var(--line);padding:12px;background:rgba(13,18,23,.98)}.chat-compose textarea{width:100%;min-height:82px;max-height:220px;resize:vertical;border:1px solid #334354;background:#0b1117;color:#edf2f6;border-radius:10px;padding:12px;outline:none}.chat-compose textarea:focus{border-color:var(--accent)}.compose-actions{display:flex;gap:8px;margin-top:8px;align-items:center}.compose-actions .phase{margin-right:auto;color:var(--muted);font-size:12px}
.check-card,.proposal-card,.change-card{max-width:880px;margin:0 auto 14px;border:1px solid #725b35;background:#201b13;border-radius:12px;padding:14px}.check-card h3,.proposal-card h3,.change-card h3{margin:0 0 8px;color:#ebd3a4}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:13px}.dice-result{font-size:22px;font-weight:800;color:#f1d8a7;margin:8px 0}.audit{font-size:12px;color:var(--muted)}
.modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;background:#111820;border:1px solid #3a4b5a;border-radius:14px;padding:18px;box-shadow:var(--shadow)}.modal h2{margin-top:0;color:#eadfc8}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.preview{height:320px;width:100%;background:#0a1015;color:#dbe3ea;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;white-space:pre-wrap;overflow:auto}.case-file{line-height:1.75}.case-file h2{margin:6px 0 0;color:var(--accent);font-size:28px}.case-file h3{margin:18px 0 6px;color:#d9c7a5;border-bottom:1px dashed var(--line);padding-bottom:4px}.case-file p{white-space:pre-wrap}.case-subtitle{color:var(--muted);margin-top:0}.case-stamp{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:11px;letter-spacing:.12em;transform:rotate(-1deg)}.briefing-list{margin:6px 0 0;padding-left:24px}.briefing-list li{margin:5px 0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.table th{color:var(--accent)}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{width:min(360px,calc(100vw - 32px));padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#151d25;box-shadow:var(--shadow);font-size:13px}.toast.ok{border-color:#3d6d4b}.toast.warn{border-color:#765a2f}.toast.danger{border-color:#73393d}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;top:54px;bottom:0;left:0;width:min(330px,88vw);z-index:30;box-shadow:var(--shadow)}.main{grid-column:1}.grid,.grid.three,.grid.four{grid-template-columns:1fr}.topbar{grid-column:1}.status-pill.optional{display:none}}

/* v1.2：职业技能构筑与模组目录 */
.scenario-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.scenario-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.scenario-card{display:flex;flex-direction:column;gap:10px;min-height:260px}.scenario-card h2{margin:0}.scenario-meta{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;border:1px solid #45576a;background:#101820;border-radius:999px;padding:3px 7px;color:#b9c7d4;font-size:11px}.tag.accent{border-color:#806a45;color:#e8cc99}.scenario-card .row{margin-top:auto}.compat{font-size:12px;line-height:1.6}.compat.good{color:var(--ok)}.compat.warn{color:var(--warn)}
.occupation-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.summary-box{border:1px solid var(--line);background:#0d141a;border-radius:9px;padding:9px}.summary-box span{display:block;color:var(--muted);font-size:11px}.summary-box b{display:block;margin-top:3px}.choice-panel{border:1px dashed #485867;border-radius:10px;padding:12px;margin:10px 0;background:#0e151b}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.skill-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.skill-toolbar .field{margin:0;min-width:170px}.skill-table-wrap{overflow:auto;max-height:600px;border:1px solid var(--line);border-radius:10px}.skill-table{width:100%;border-collapse:collapse;font-size:12px;min-width:850px}.skill-table th{position:sticky;top:0;z-index:2;background:#17212b;color:var(--accent);padding:8px;border-bottom:1px solid var(--line);text-align:left}.skill-table td{padding:6px 8px;border-bottom:1px solid #25313d}.skill-table tr.occupation-row{background:rgba(116,92,50,.13)}.skill-table tr.invalid-row{background:rgba(122,45,51,.18)}.skill-table input{width:74px;padding:6px;text-align:center}.skill-table input:disabled{background:#0a0f14;color:#596570}.skill-name{min-width:150px}.skill-name small{display:block;color:var(--muted)}.skill-final{font-weight:800;font-size:14px}.skill-cap{color:var(--muted)}.point-status{position:sticky;bottom:0;background:#111820;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 -8px 24px #0005}.point-status .bad{color:var(--danger)}.point-status .good{color:var(--ok)}.allocation-note{font-size:12px;color:var(--muted);line-height:1.6}.kbd{border:1px solid #52606d;background:#0a1015;border-radius:5px;padding:1px 5px;font-size:11px;color:#dce4eb}
@media(max-width:900px){.scenario-grid{grid-template-columns:1fr}.scenario-filters,.occupation-summary,.choice-grid,.point-status{grid-template-columns:1fr}}


/* v1.3：即兴开场、分层记忆与开放结局 */
.dossier-card{border-color:#6f6249!important;background:linear-gradient(180deg,#171b1f,#111820)!important}.opening-card{border-color:#49606d!important;background:#101922!important}.suggestion-card{border-color:#425b50!important;background:#101b18!important}.ending-card{border-color:#8a6940!important;background:#211a10!important}.action-suggestions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;padding:8px;border:1px dashed #334657;border-radius:9px;background:#0e151c}.suggestion-btn{padding:5px 9px;font-size:12px}.context-block{max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0a1015;border:1px solid var(--line);border-radius:8px;padding:10px;color:#c9d4de}.ending-option{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#111820}.ending-option h3{margin:0 0 6px;color:#e6c991}.ending-proposal{border-color:#8b6637;background:#261b0e}.small{font-size:12px}.section .notice .btn{width:100%}.chat-head{flex-wrap:wrap}

.error-panel{max-width:880px;margin:0 auto 14px;border:1px solid #8a3f46;background:#26171a;border-radius:12px;padding:14px;color:#f0c3c7}
.error-panel h3{margin:0 0 8px;color:#ffb6bc}.error-panel p{margin:7px 0;line-height:1.65}.error-panel details{margin-top:10px}.error-panel summary{cursor:pointer;color:#e8c5c8}.raw-response{max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0b0f13;border:1px solid #63343a;border-radius:8px;padding:10px;color:#e8d9db;font-size:12px;line-height:1.55}

.hint-card{border-color:#8f7436!important;background:#17150f!important}
.continuity-card{border-color:#53758c!important;background:#101820!important}
.btn.warn{border-color:#9b7631;color:#f0c879;background:#241d10}
.small{font-size:12px}
</style>

<body>
<div id="app" class="app">
  <header class="topbar">
    <button id="toggleSidebar" class="icon-btn" type="button">☰</button>
    <div class="brand">TRPG / 调查档案</div>
    <div id="topSlot" class="status-pill">未建档</div>
    <div id="topSystem" class="status-pill optional">系统：未选择</div>
    <div id="topPhase" class="status-pill">阶段：setup</div>
    <div id="topConnection" class="status-pill optional">API：未测试</div>
    <div class="top-actions">
      <button type="button" data-nav="setup">配置</button>
      <button type="button" data-nav="character">角色</button>
      <button type="button" data-nav="scenario">剧本</button>
      <button type="button" data-nav="chat">跑团</button>
      <button type="button" data-nav="saves">存档</button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar"></aside>

  <main class="main">
    <section id="view-setup" class="view active"></section>
    <section id="view-character" class="view"></section>
    <section id="view-scenario" class="view"></section>
    <section id="view-chat" class="view chat-view"></section>
    <section id="view-saves" class="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastWrap" class="toast-wrap"></div>
<input id="scenarioFileInput" class="hidden" type="file" accept=".txt,.md,text/plain,text/markdown">
<input id="saveFileInput" class="hidden" type="file" accept=".json,application/json">
<input id="improvSeedFileInput" class="hidden" type="file" accept=".json,application/json">

  for(const checkId of spec.checks||[])routes.push({id:clueId+"-check-"+checkId,type:"check",checkId,minimumRank:"regular"});
  if(spec.automatic)routes.push({id:clueId+"-automatic",type:"automatic"});
  for(const checkId of spec.failureForward||[])routes.push({id:clueId+"-failure-forward-"+checkId,type:"failure_forward",checkId,cost:{tension:1}});
  return routes
}

}

function caseIntegrityAllNpcs(scenario){const ids=new Set();for(const npc of scenario?.initialNpcs||[])if(npc?.id)ids.add(npc.id);for(const node of allScenarioNodes(scenario))for(const npc of node.npcs||[])if(npc?.id)ids.add(npc.id);return ids}

function buildSystemPrompt(){return `你是单人调查型 TRPG 的 KP 裁决者与叙事者。只返回一个 JSON 对象，不得返回 Markdown 或解释。
核心原则：
1. 玩家行动先裁决是否需要检定。你可以提出检定，但目标值、骰点、成功失败均由页面决定。
2. action_adjudication 阶段必须返回 decision=check 或 decision=no_check。decision=check 时 narrative 只能描述检定前的即时反应，不得提前揭示成功结果；stateChanges、campaignChanges 必须为空，nodeProposal、endingProposal 必须为 null。
3. public_check_continuation 与 secret_check_continuation 只能依据提供的不可修改检定记录续写。暗骰叙事不得透露发生过检定、技能值、骰点或成败。
4. 受保护线索只能通过合法获取路线揭示。revealClue 必须提供 sourceCheckRecordId 或 sourceRouteId；若使用 automatic/flag/npc/clue 路线，应优先提供对应 sourceRouteId，不要把本轮无关检定记录冒充为线索来源。不得仅凭自然语言宣布发现隐藏线索。
5. 页面维护 HP、SAN、物品、线索、节点、张力、威胁时钟和结局状态；你只能使用白名单 operation 提议变化。
6. SAN 必须为 public+mandatory，并提供稳定 exposureKey；同一刺激不得重复要求 SAN。
7. 关键线索必须允许替代获取或失败前进。失败决定代价，不应让主线永久卡死。
8. 检定续写必须严格服从输入中的 outcomeGuidance：failure 只给最低限度可行动线索并承担代价；fumble 只在防止死局时保留最低限度线索且必须有更严重后果；regular 给完整核心线索；hard 给核心线索和 1 项具体额外洞察；extreme 给核心线索和 2 项相互印证的洞察；critical 给突破性洞察并可附带一项有限优势。
9. revealClue 在 hard、extreme、critical 时应提供 insight；failure 或 fumble 时不得通过 insight 或 narrative 泄露完整来源、精确身份、最终解释或额外隐藏线索。
8. briefing.caseObjectives 是宽泛委托；节点 goals、导演情境、NPC 隐藏动机和主持资料不得直接泄露。
9. 即兴模式基于当前情境、NPC 目标和威胁时钟响应玩家，不得强迫玩家走预设顺序。
10. 地点连续性必须服从页面节点图。每轮必须返回 locationEffect。实际完成地点切换时使用 transition_proposal 并提供合法 nodeProposal；留在原地可使用 stay；移动受阻使用 blocked；在当前区域搜索使用 searched；绕行后回到原处使用 returned；方向或地点无法确认使用 uncertain。普通行动允许没有线索、没有进度、没有状态变化，不得为了让每轮“有意义”而硬塞房间、线索或奖励。
11. 结构化模组不得创建临时节点。即兴/降级模式只有在现有节点无法承载新的调查用途时才可提议临时节点；临时节点必须包含 purpose、novelElements，并提供返回当前地点的路径。不得连续生成相似的门、房间、钥匙或走廊。
12. 普通回合 actionSuggestions 必须返回 []。只有玩家主动点击“请求提示”时才允许给方向提示。
13. 没有变化时返回空数组。每项变化必须包含 operation，不得用 action、type、description 代替。
14. 响应必须包含 protocolVersion、requestId、baseRevision、decision、narrative、check、stateChanges、campaignChanges、locationEffect、nodeProposal、endingProposal、actionSuggestions。
15. 单轮行动可以没有收益。普通观察、闲聊、等待、走错方向、重复搜索都可以只产生自然叙事；不得为了回应玩家而凭空制造线索、暗门、钥匙、新 NPC、检定或调查进度。
16. 普通环境信息不等于正式线索。只有真正具有持续调查价值并满足获取规则的信息才进入线索状态。
17. NPC 说出重要承诺、否认、解释、改口，或态度/关系/当前意图发生长期变化时，复用 updateNpc 更新连续性；后续发言必须尊重已记录 claims。故意撒谎或改口必须在世界中存在合理原因。
18. 连续无进展时让既有世界主动行动，而不是给玩家正确答案。
19. 不要重复换词描述同一个异常。若玩家重复做同一件事且世界没有变化，可以明确“没有新的发现”；若世界变化，变化必须来自已存在的 NPC 动机、威胁、时间或环境。
20. 玩家明确等待、休息或进行长时间搜索时，叙事要体现时间流逝；只有能给出与当前时间一致的新值时才使用 advanceTime，不能伪造精确时间。
21. memory.worldContinuity 是压缩后的近期世界事件与停滞状态；优先保持其连续性。memory.temporalIntent 仅说明行动是否明显耗时，不代表自动奖励、自动惩罚或自动推进。
22. 内容边界：${state.config.contentBoundaries||"无额外说明"}。叙事风格：${state.config.narrativeStyle||"克制、调查优先"}。
20. ${pacingDirective()}` }

"use strict";

/* v1.5.12 Ending / Resolution Gate
 * AI may propose an ending; browser-owned canonical state decides whether it may commit.
 * BLOCK UNSAFE STATE, NOT PLAYER ACTION.
 */
const ENDING_RESOLUTION_GATE_VERSION="1.0";
const ENDING_GATE_CLOCK_STATES=new Set(["active","triggered","resolved"]);
const ENDING_GATE_SEMANTIC_KINDS=new Set(["DISCOVERY","ACCESS","SOCIAL","THREAT","RESOLUTION"]);

function normalizeEndingGateClockRequirement(raw,index=0){
  const item=isPlainObject(raw)?raw:{};

    ...deepClone(ending),
    requiredFlags:listStrings(ending.requiredFlags,16,120),
    forbiddenFlags:listStrings(ending.forbiddenFlags,16,120),
    requiredClueIds:listStrings(ending.requiredClueIds,24,120),
    requiresAnyClueIds:listStrings(ending.requiresAnyClueIds,24,120),
    requiredResolvedLeadIds:listStrings(ending.requiredResolvedLeadIds,16,120),
    requiredResolvedQuestionIds:listStrings(ending.requiredResolvedQuestionIds,16,120),
    requiredNodeIds:listStrings(ending.requiredNodeIds,16,120),
    requiredSemanticKinds:listStrings(ending.requiredSemanticKinds,8,40),
    requiredClockStates:Array.isArray(ending.requiredClockStates)?ending.requiredClockStates.map(normalizeEndingGateClockRequirement).slice(0,16):[],
    requireNoActiveThreats:Boolean(ending.requireNoActiveThreats),
    minClues:clamp(Number(ending.minClues||0),0,50),
    outcomeRequirements:isPlainObject(ending.outcomeRequirements)?deepClone(ending.outcomeRequirements):null

  for(const event of events)for(const kind of event?.kinds||[])if(ENDING_GATE_SEMANTIC_KINDS.has(kind))set.add(kind);
  return set
}

  if(!clock)return false;
  if(required==="resolved")return Boolean(clock.resolved);
  if(required==="triggered")return Boolean(clock.triggered);
  if(required==="active")return Boolean(clock.active)&&!clock.triggered&&!clock.resolved;
  return false
}
function endingGateEvaluate(ending,campaign=state.campaign,clues=state.clues){

  for(const flag of e.forbiddenFlags)if(flags[flag]===true)missing.push({code:"forbidden_flag",id:flag});

  for(const clueId of e.requiredClueIds)if(!clueIds.has(clueId))missing.push({code:"required_clue",id:clueId});
  if(e.requiresAnyClueIds.length&&!e.requiresAnyClueIds.some(id=>clueIds.has(id)))missing.push({code:"any_clue",ids:e.requiresAnyClueIds});
  for(const leadId of e.requiredResolvedLeadIds)if(leads.get(leadId)?.status!=="resolved")missing.push({code:"resolved_lead",id:leadId});
  for(const questionId of e.requiredResolvedQuestionIds)if(questions.get(questionId)?.status!=="resolved")missing.push({code:"resolved_question",id:questionId});
  if(e.requiredNodeIds.length&&!e.requiredNodeIds.includes(campaign?.currentNodeId))missing.push({code:"required_node",ids:e.requiredNodeIds,actual:campaign?.currentNodeId||null});

function endingGateMissingLabel(item){

function endingGateContext(campaign=state.campaign,clues=state.clues){
  return{version:ENDING_RESOLUTION_GATE_VERSION,authority:"browser_canonical_resolution",endings:(state.scenario?.endings||[]).map(ending=>{const gate=endingGateEvaluate(ending,campaign,clues);return{id:ending.id,title:ending.playerTitle||ending.title,ready:gate.ready,alwaysAvailable:gate.alwaysAvailable,missing:gate.missing.map(item=>({code:item.code,label:endingGateMissingLabel(item)}))}})}

  state.runtime.endingResolutionGate.version=ENDING_RESOLUTION_GATE_VERSION;
  state.runtime.endingResolutionGate.lastRecovery=state.runtime.endingResolutionGate.lastRecovery||null;
  state.runtime.endingResolutionGate.lastConfirmed=state.runtime.endingResolutionGate.lastConfirmed||null;

/* src/firearms-impaling.js */
"use strict";

/* v1.6.10 Firearms / Impaling Resolution
 * Browser-owned CoC7 single-shot firearm attack and impaling damage extension.
 * Supported in this stage:
 * - melee_impaling weapons through the existing melee opposed exchange;
 * - single-shot firearm_impaling attacks within base range;
 * - readied-firearm DEX +50 initiative, point-blank bonus die, Dive for Cover;
 * - impale damage = max weapon + max applicable melee DB + one additional weapon roll.
 * Deferred: multiple shots, automatic fire, malfunction, long-range bands, shotgun pellets.
 */
const FIREARMS_IMPALING_VERSION="1.0";
const FIREARMS_IMPALING_AUTHORITY="browser_coc_firearms_impaling";
const FIREARM_DEFAULT_RANGE_FEET=45;
const FIREARM_SKILL_IDS=new Set(["firearms_handgun","firearms_rifle"]);

function firearmsIsImpalingMelee(weapon){return weapon?.mode==="melee_impaling"}
function firearmsIsFirearm(weapon){return weapon?.mode==="firearm_impaling"}
function firearmsIsImpaling(weapon){return firearmsIsImpalingMelee(weapon)||firearmsIsFirearm(weapon)}
function firearmsSkillId(raw){const id=asString(raw?.skillId,80)||"firearms_handgun";if(!FIREARM_SKILL_IDS.has(id))throw new Error("v1.6.10 单发枪械仅支持 firearms_handgun / firearms_rifle");return id}
function firearmsNormalizeExtendedWeapon(raw){
  const source=isPlainObject(raw)?raw:{},mode=asString(source.mode,60);
  if(mode!=="melee_impaling"&&mode!=="firearm_impaling")return null;
  const damage=asString(source.damage,32);const parsed=parseDiceExpression(damage);if(!parsed.ok)throw new Error(`武器伤害骰无效：${parsed.error}`);
  if(mode==="melee_impaling")return{id:asString(source.id,80)||"melee-impaling",label:asString(source.label,80)||"穿刺近战武器",damage:parsed.value.text,addsDamageBonus:source.addsDamageBonus!==false,mode,skillId:asString(source.skillId,80)||"fighting_brawl",impaling:true};
  return{id:asString(source.id,80)||"firearm",label:asString(source.label,80)||"单发枪械",damage:parsed.value.text,addsDamageBonus:false,mode,skillId:firearmsSkillId(source),baseRangeFeet:clamp(Math.floor(Number(source.baseRangeFeet)||FIREARM_DEFAULT_RANGE_FEET),1,3000),impaling:true}
}

const __firearmsCombatDamageNormalizeWeapon=combatDamageNormalizeWeapon;
combatDamageNormalizeWeapon=function(raw=COMBAT_DEFAULT_WEAPON){const extended=firearmsNormalizeExtendedWeapon(raw);return extended||__firearmsCombatDamageNormalizeWeapon(raw)};

const __firearmsCombatDamagePlayerLoadout=combatDamagePlayerLoadout;
combatDamagePlayerLoadout=function(){const base=__firearmsCombatDamagePlayerLoadout(),raw=isPlainObject(state.character?.combatLoadout)?state.character.combatLoadout:{};return base?{...base,firearmReadied:raw.firearmReadied===true}:base};
const __firearmsCombatDamageSetPlayerLoadout=combatDamageSetPlayerLoadout;
combatDamageSetPlayerLoadout=function({weapon,armor=0,firearmReadied=false}={}){
  if(state.character?.system!=="coc7")throw new Error("仅 CoC7 角色支持战斗伤害配置");if(combatIsActive())throw new Error("Combat Mode 进行中不能更换玩家伤害配置");if(activeAbortController||state.runtime?.activeRequestId)throw new Error("AI 请求进行中，不能修改战斗伤害配置");
  const normalizedWeapon=combatDamageNormalizeWeapon(weapon||COMBAT_DEFAULT_WEAPON),normalized={version:COMBAT_DAMAGE_VERSION,authority:COMBAT_DAMAGE_AUTHORITY,weapon:normalizedWeapon,armor:clamp(Math.floor(Number(armor)||0),0,99),firearmReadied:firearmsIsFirearm(normalizedWeapon)&&firearmReadied===true};state.character.combatLoadout=normalized;bumpRevision();renderAll();return deepClone(normalized)
};

function firearmsPlayerSkill(weapon){return firearmsIsFirearm(weapon)?clamp(combatSkillValue(state.character,weapon.skillId),1,100):null}
function firearmsOpponentSkill(raw,weapon,fallback){if(!firearmsIsFirearm(weapon))return null;const value=Number(raw?.firearmSkill??raw?.firearms??raw?.[weapon.skillId]??fallback);if(!Number.isFinite(value)||value<1||value>100)throw new Error(`${asString(raw?.label||raw?.name,80)||"对手"} 的 Firearms 必须在 1 到 100 之间`);return clamp(Math.floor(value),1,100)}
const __firearmsCombatDamageEnhancePlayer=combatDamageEnhancePlayer;
combatDamageEnhancePlayer=function(participant){const enhanced=__firearmsCombatDamageEnhancePlayer(participant),loadout=combatDamagePlayerLoadout();return{...enhanced,firearmSkill:firearmsPlayerSkill(enhanced.weapon),firearmReadied:firearmsIsFirearm(enhanced.weapon)&&loadout?.firearmReadied===true,attackForfeitCount:Math.max(0,Math.floor(Number(enhanced.attackForfeitCount)||0))}};
const __firearmsCombatDamageEnhanceOpponent=combatDamageEnhanceOpponent;
combatDamageEnhanceOpponent=function(participant,raw={}){const enhanced=__firearmsCombatDamageEnhanceOpponent(participant,raw);return{...enhanced,firearmSkill:firearmsOpponentSkill(raw,enhanced.weapon,enhanced.fighting),firearmReadied:firearmsIsFirearm(enhanced.weapon)&&raw.firearmReadied===true,attackForfeitCount:Math.max(0,Math.floor(Number(raw.attackForfeitCount)||0))}};

function firearmsInitiativeDex(participant){return Number(participant?.dex||0)+(firearmsIsFirearm(participant?.weapon)&&participant.firearmReadied===true?50:0)}
combatOrder=function(participants){return participants.map((participant,index)=>({...participant,__order:index,__initiative:firearmsInitiativeDex(participant)})).sort((a,b)=>Number(b.__initiative)-Number(a.__initiative)||a.__order-b.__order).map(item=>item.id)};

function firearmsPointBlankFeet(shooter){return Math.max(1,Number(shooter?.dex||1)/5)}
function firearmsAttackForfeited(participant){return Math.max(0,Math.floor(Number(participant?.attackForfeitCount)||0))>0}
const __firearmsCombatAdvanceTurn=combatAdvanceTurn;
combatAdvanceTurn=function(options={}){const actor=combatCurrentActor(),consume=actor&&firearmsAttackForfeited(actor);if(consume)actor.attackForfeitCount=Math.max(0,Number(actor.attackForfeitCount||0)-1);return __firearmsCombatAdvanceTurn(options)};
const __firearmsCombatResolveMelee=combatResolveMelee;
combatResolveMelee=function(options={}){const actor=combatCurrentActor();if(actor&&firearmsAttackForfeited(actor))throw new Error("Dive for Cover 已令当前角色失去本次攻击；请执行跳过/非攻击动作");return __firearmsCombatResolveMelee(options)};

const __firearmsCombatDamageResolveAmount=combatDamageResolveAmount;
combatDamageResolveAmount=function({owner,mode,weaponRoller=null,bonusRoller=null}={}){
  const weapon=combatDamageNormalizeWeapon(owner?.weapon||COMBAT_DEFAULT_WEAPON),impale=(mode==="impaling_extreme")||(mode==="initiator_extreme_eligible"&&firearmsIsImpalingMelee(weapon));
  if(!impale)return __firearmsCombatDamageResolveAmount({owner,mode,weaponRoller,bonusRoller});
  const weaponMax=combatDamageMaxDiceExpression(weapon.damage),extra=combatDamageRollWeapon(weapon.damage,weaponRoller),bonus=weapon.addsDamageBonus!==false?(owner.damageBonus||combatDamageBonusProfile(owner.str,owner.siz)):{kind:"flat",value:0,expression:"0",max:0},bonusMax=weapon.addsDamageBonus!==false?Number(bonus.max||0):0,grossDamage=Math.max(0,weaponMax+bonusMax+Number(extra.total||0));
  return{mode:"impaling_extreme",weapon,impaling:true,weaponResult:{expression:weapon.damage,rawRolls:[],modifier:0,total:weaponMax,maximized:true},damageBonusResult:{expression:bonus.expression||"0",rawRolls:[],modifier:bonus.kind==="flat"?Number(bonus.value||0):0,total:bonusMax,maximized:true},impaleExtraResult:extra,grossDamage}
};

function firearmsResolveShot({targetId,distanceFeet=10,diveForCover=false,shooterRoller=null,diveRoller=null,weaponRoller=null,dyingRoller=null}={}){
  combatAssertMutable();const combat=combatNormalizeState();if(!combat.active)throw new Error("当前没有进行中的 Combat Mode");const shooter=combatCurrentActor(),target=combatParticipant(asString(targetId,80));if(!shooter||!target||target.active===false)throw new Error("枪械参与者无效");if(shooter.id===target.id||shooter.side===target.side)throw new Error("当前枪械攻击仅支持敌对目标");if(firearmsAttackForfeited(shooter))throw new Error("Dive for Cover 已令当前角色失去本次攻击；请执行跳过/非攻击动作");
  const weapon=combatDamageNormalizeWeapon(shooter.weapon||COMBAT_DEFAULT_WEAPON);if(!firearmsIsFirearm(weapon))throw new Error("当前行动者未配置 v1.6.10 单发穿刺枪械");const skill=clamp(Number(shooter.firearmSkill)||0,1,100),distance=Number(distanceFeet);if(!Number.isFinite(distance)||distance<=0)throw new Error("枪械距离必须为正数");if(distance>Number(weapon.baseRangeFeet||FIREARM_DEFAULT_RANGE_FEET))throw new Error("v1.6.10 仅结算枪械 Base Range 内的单发射击；远距离档后续实现");
  let diveRoll=null,diveSuccess=false;if(diveForCover){diveRoll=combatRoll(target.dodge,{roller:diveRoller});diveSuccess=combatRankSuccess(diveRoll.rank);target.attackForfeitCount=Math.max(1,Math.floor(Number(target.attackForfeitCount)||0))}
  const pointBlank=distance<=firearmsPointBlankFeet(shooter),shooterRoll=combatRoll(skill,{bonusDice:pointBlank?1:0,penaltyDice:diveSuccess?1:0,roller:shooterRoller}),hit=combatRankSuccess(shooterRoll.rank),extreme=hit&&["extreme","critical"].includes(shooterRoll.rank),at=nowIso();
  const exchange={id:uid("combat-exchange"),kind:"firearm_single_shot",authority:FIREARMS_IMPALING_AUTHORITY,round:combat.round,turnIndex:combat.turnIndex,attackerId:shooter.id,attackerLabel:shooter.label,defenderId:target.id,defenderLabel:target.label,response:diveForCover?"dive_for_cover":"none",distanceFeet:distance,baseRangeFeet:weapon.baseRangeFeet,pointBlank,pointBlankBonusDice:pointBlank?1:0,diveForCover:Boolean(diveForCover),diveRoll,diveSuccess,divePenaltyDice:diveSuccess?1:0,attackerRoll:shooterRoll,outcome:hit?"firearm_hits":"firearm_misses",winnerId:hit?shooter.id:null,damageDisposition:hit?{pending:true,ownerId:shooter.id,targetId:target.id,mode:extreme?"impaling_extreme":"regular",authority:FIREARMS_IMPALING_AUTHORITY,hpCommitted:false}:null,at};
  combat.lastExchange=deepClone(exchange);combat.history.push(deepClone(exchange));if(combat.history.length>COMBAT_HISTORY_LIMIT)combat.history.splice(0,combat.history.length-COMBAT_HISTORY_LIMIT);addLog("combat",`${shooter.label} → ${target.label}：${exchange.outcome}${diveForCover?` / dive ${diveSuccess?"success":"failure"}`:""}`,{});const turn=combatAdvanceTurn({actionKind:"firearm_attack",dyingRoller});let damage=null;if(exchange.damageDisposition?.pending){const applied=combatDamageApplyDisposition(exchange,{weaponRoller});exchange.damageDisposition=applied.exchange.damageDisposition;exchange.damageResult=applied.exchange.damageResult;damage=applied.result}bumpRevision();renderAll();return{exchange:deepClone(exchange),damage:deepClone(damage),turn,state:combatSnapshot()}
}

function firearmsContext(){const combat=combatSnapshot(),current=combat.currentActorId?combat.participants.find(item=>item.id===combat.currentActorId):null;return{version:FIREARMS_IMPALING_VERSION,authority:FIREARMS_IMPALING_AUTHORITY,combatActive:combat.active,currentActorId:combat.currentActorId,currentActorFirearm:current&&firearmsIsFirearm(current.weapon)?{skill:current.firearmSkill,readied:current.firearmReadied,initiativeDex:firearmsInitiativeDex(current),weapon:deepClone(current.weapon)}:null,lastFirearmExchange:combat.lastExchange?.kind==="firearm_single_shot"?deepClone(combat.lastExchange):null,policy:"browser_single_shot_firearm_hit_dive_for_cover_and_impaling_damage",deferred:["multiple_shots","automatic_fire","malfunction","long_range_bands","shotgun_pellet_ranges","reload_reready_action_economy"],aiAuthority:"cannot_roll_firearms_or_commit_impaling_damage"}}

const __firearmsNormalizeLoadedState=normalizeLoadedState;
normalizeLoadedState=function(raw){const rawFirearmReadied=raw?.character?.combatLoadout?.firearmReadied===true,loaded=__firearmsNormalizeLoadedState(raw);if(loaded.character?.system==="coc7"&&isPlainObject(loaded.character.combatLoadout)){const weapon=combatDamageNormalizeWeapon(loaded.character.combatLoadout.weapon||COMBAT_DEFAULT_WEAPON);loaded.character.combatLoadout={...loaded.character.combatLoadout,weapon,firearmReadied:firearmsIsFirearm(weapon)&&rawFirearmReadied}}return loaded};

const __firearmsCombatDamageControlsHtml=combatDamageControlsHtml;
combatDamageControlsHtml=function(){
  if(state.character?.system!=="coc7")return"";const loadout=combatDamagePlayerLoadout(),combat=combatSnapshot();if(combat.active)return __firearmsCombatDamageControlsHtml();const weapon=loadout.weapon,firearm=firearmsIsFirearm(weapon),impaling=firearmsIsImpalingMelee(weapon);

combatBindControls=function(){
  const start=$("#combatStartBtn");if(start)start.addEventListener("click",()=>{try{const mode=$("#combatOpponentWeaponMode")?.value||"melee_non_impaling",firearm=mode==="firearm_impaling";combatStart({opponents:[{label:$("#combatOpponentLabel")?.value,dex:Number($("#combatOpponentDex")?.value),fighting:Number($("#combatOpponentFight")?.value),dodge:Number($("#combatOpponentDodge")?.value),responsePreference:$("#combatOpponentResponse")?.value,firearmSkill:Number($("#combatOpponentFirearm")?.value),firearmReadied:Boolean($("#combatOpponentReadied")?.checked),weapon:{id:"opponent-weapon",label:"对手武器",damage:$("#combatOpponentWeaponDamage")?.value,addsDamageBonus:!firearm,mode,skillId:"firearms_handgun",baseRangeFeet:Number($("#combatOpponentBaseRange")?.value)}}]})}catch(error){toast(error.message,"error")}});
  const firearm=$("#combatFirearmAttackBtn");if(firearm)firearm.addEventListener("click",()=>{try{const combat=combatSnapshot(),current=combat.participants.find(item=>item.id===combat.currentActorId),target=combat.participants.find(item=>item.side!==current.side&&item.active!==false);if(!target)throw new Error("没有可射击的目标");firearmsResolveShot({targetId:target.id,distanceFeet:Number($("#combatFirearmDistance")?.value),diveForCover:Boolean($("#combatTargetDive")?.checked)})}catch(error){toast(error.message,"error")}});
  const playerAttack=$("#combatPlayerAttackBtn");if(playerAttack)playerAttack.addEventListener("click",()=>{try{const target=combatSnapshot().participants.find(item=>item.side==="opposition"&&item.active!==false);if(!target)throw new Error("没有可攻击的对手");combatResolveMelee({defenderId:target.id,response:target.responsePreference})}catch(error){toast(error.message,"error")}});
  const opponentAttack=$("#combatOpponentAttackBtn");if(opponentAttack)opponentAttack.addEventListener("click",()=>{try{combatResolveMelee({defenderId:"player",response:$("#combatPlayerResponse")?.value})}catch(error){toast(error.message,"error")}});
  const pass=$("#combatPassBtn");if(pass)pass.addEventListener("click",()=>{try{combatPassTurn()}catch(error){toast(error.message,"error")}});const end=$("#combatEndBtn");if(end)end.addEventListener("click",()=>{try{combatEnd("manual_end")}catch(error){toast(error.message,"error")}})
};
</script>
</body>
</html>
